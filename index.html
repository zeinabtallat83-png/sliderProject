<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolutar</title>
    <style>
   p 
     { font-size: 30px;
        font-weight: bolder;
    color: brown;
     text-align: center; }
section
    { text-align: center;
   border-radius: 10px;
   border: 6px double black;
    height: 500px;
    width: 300px;
    margin-left: 500px;
background-color: rgb(119, 119, 124);}
.but
    {display: flex;
   flex-direction: row;
   padding: auto;}
button
   {height: 60px;
   width: 50px;
  margin: 15px;
  border-radius: 30%;
}
.inp 
   {display: flex;
   flex-direction:column;
   padding: auto; 
 }
input
   { height:50px;
    width: 150px;
    margin-bottom: 30px;
    margin-left: 70px;
    border-radius: 20px;
    border: 3px solid rgb(39, 39, 77);
}
h1{ font-size: 20px; color: brown;}
        </style>
</head>
<body>
 <section>
<p> Calcolutar</p>
<div class="inp">
    <input type="number"id="num1">
    <input type="number" id="num2">
 <div class="but">
    <button onclick="sum()">+</button>
    <button onclick="subtract()">-</button>
    <button onclick="divide()" >/</button>
    <button onclick="multiply()" >*</button>
    <button onclick="percent()" >%</button>
</div> 
</div>
    <h1 id="result"> </h1>
    </section>

 <script>
  function sum(){
    let x= parseFloat(document.getElementById("num1").value);
    let z = parseFloat(document.getElementById("num2").value);
    document.getElementById("result").textContent = x + z ;
}
 function subtract(){
    let x= parseFloat(document.getElementById("num1").value);
    let z = parseFloat(document.getElementById("num2").value);
    document.getElementById("result").textContent = x - z ;
}

 function divide (){
    let x= parseFloat(document.getElementById("num1").value);
    let z = parseFloat(document.getElementById("num2").value);
    document.getElementById("result").textContent = x / z ;
}
 function multiply(){
    let x= parseFloat(document.getElementById("num1").value);
    let z = parseFloat(document.getElementById("num2").value);
    document.getElementById("result").textContent = x * z ;
}
 function percent(){
    let x= parseFloat(document.getElementById("num1").value);
    let z = parseFloat(document.getElementById("num2").value);
    document.getElementById("result").textContent = x / z/100 ;
}





</script>
</body>
</html>
